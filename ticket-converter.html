<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Quality Tools</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="index.css" />
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
  </head>
  <body>
    <div id="container">
      <div class="card" id="nav-card">
        <nav>
          <ul class="nav">
            <li>
              <a href="index.html">DER2 Report</a>
            </li>
            <li>
              <a href="ticket-converter.html">Ticket Converter</a>
            </li>
          </ul>
        </nav>
        <div class="card" id="content-card">
          <div class="glass" id="content-box">
            <button class="button button-scan" id="scan-ticket">
              Scan Ticket
            </button>

            <div class="form-row">
              <div class="input-clear">
                <input
                  type="text"
                  id="ticket-num"
                  inputmode="numeric"
                  pattern="[0-9]*"
                  maxlength="20"
                />
              </div>
              <div id="multiContainer">
                <textarea id="multi" inputmode="numeric" rows="3"></textarea>
              </div>
            </div>
          </div>

          <div class="glass" id="action-box">
            <button class="button button-confirm" id="convertTicket">
              Convert
            </button>
            <button class="button button-clear" id="clear-ticket">
              Clear All
            </button>
            <button class="button" id="multi-ticket">Add Multiple</button>
          </div>

          <div class="output">
            <table id="ticketTable">
              <th>Barcode</th>
              <th>Matrics</th>
              <th>EWM</th>
              <th>Barcode</th>
              <div id="copyContainer">
                <button class="copy-btns" id="copyMatricsBtn">
                  Copy Matrics
                </button>
                <button class="copy-btns" id="copyEWMBtn">Copy EWM</button>
              </div>
            </table>
          </div>
        </div>
        <footer class="site-footer">
          <p>© 2026 Victor Garcia. All rights reserved.</p>
        </footer>
      </div>
    </div>

    <!-- Modals -->
    <div id="scannerModal" class="modal">
      <div class="modal-content">
        <div id="scanner">
          <div id="scanOverlay"></div>
          <!-- overlay box -->
        </div>
        <div class="modal-actions">
          <button id="cancelScan" class="cancel-btn">Cancel</button>
        </div>
      </div>
    </div>
    <div id="showBarcode" class="modal">
      <div class="modal-content">
        <svg id="barcode"></svg>
        <div class="modal-actions">
          <button id="hideBarcode" class="confirm-btn">Ok</button>
        </div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
