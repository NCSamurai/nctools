<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Quality Tools</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.12.3/dist/JsBarcode.all.min.js"></script>
  </head>
  <body>
    <div id="container">
      <div class="card" id="nav-card">
        <nav>
          <ul class="nav">
            <li>
              <a href="index.html">DER2 Report</a>
            </li>
            <li>
              <a href="ticket-converter.html">Ticket Converter</a>
            </li>
            <li>
              <a href="pi-doc.html">PI Documents</a>
            </li>
            <li>
              <a href="cycle-counting.html">Cycle Count Report</a>
            </li>
          </ul>
        </nav>
        <div class="card" id="content-card">
          <div class="glass" id="content-box">
            <div id="scanner-btn">
              <button class="button button-scan" id="scan-ticket">
                Scan Ticket
              </button>
            </div>

            <div class="form-row">
              <div class="input-box">
                <textarea
                  id="multi-ticket"
                  inputmode="numeric"
                  rows="3"
                ></textarea>
              </div>
            </div>
          </div>

          <div class="glass" id="action-box">
            <button class="button button-confirm" id="convert-ticket-btn">
              Convert
            </button>
            <button class="button button-clear" id="clear-all-btn">
              Clear All
            </button>
            <!-- <button class="button" id="multi-ticket-btn">Add Multiple</button> -->
            <button class="button" id="copyMatricsBtn">Copy Matrics</button>
            <button class="button" id="copyEWMBtn">Copy EWM</button>
          </div>

          <button class="button" id="clearTable">Clear Table</button>
          <div class="output">
            <table id="ticketTable">
              <th>Barcode</th>
              <th>Matrics</th>
              <th>EWM</th>
              <th>Barcode</th>
            </table>
          </div>
        </div>
        <footer class="site-footer">
          <p>© 2026 Victor Garcia. All rights reserved.</p>
        </footer>
      </div>
    </div>

    <!-- Modals -->
    <div id="scannerModal" class="modal">
      <div class="modal-content">
        <div id="scanner">
          <div id="scanOverlay"></div>
          <!-- overlay box -->
        </div>
        <div class="modal-actions">
          <button id="cancelScan" class="button button-clear">Cancel</button>
        </div>
      </div>
    </div>
    <div id="showBarcode" class="modal">
      <div class="modal-content frosted-glass">
        <svg id="barcode"></svg>
        <div class="modal-actions">
          <button id="hideBarcode" class="button button-confirm">Ok</button>
        </div>
      </div>
    </div>
    <script src="live/converter-live.js"></script>
    <!-- <script src="js/converter.js"></script> -->
  </body>
</html>
