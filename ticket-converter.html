<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <title>Document</title>
  </head>
  <body>
    <div id="container">
      <div class="card" id="nav-card">
        <nav>
          <ul class="nav">
            <li>
              <a href="index.html">DER2 Report</a>
            </li>
            <li>
              <a href="ticket-converter.html">Ticket Converter</a>
            </li>
          </ul>
        </nav>
        <div class="card" id="content-card">
          <div class="glass" id="content-box">

            <div class="form-row">
              <div class="input-clear">
                <label class="switch">
                  <input type="checkbox" id="toggleSwitch" />
                  <span class="slider"></span>
                </label>
                <input
                  type="text"
                  id="ticket_num"
                  inputmode="numeric"
                  pattern="[0-9]*"
                  maxlength="20"
                />
                <button id="convertTicket">Convert</button>
                <button class="scan-btn" id="scan_ticket">Scan Ticket</button>
              </div>
              <div id="multiContainer" style="display: none">
                <textarea id="multi" inputmode="numeric" rows="3"></textarea>
              </div>
            </div>

          </div>
          <div class="output"></div>
        </div>
      </div>
    </div>
  </body>
</html>
