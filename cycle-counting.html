<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <title>Quality Tools</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.12.3/dist/JsBarcode.all.min.js"></script>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <!-- Chart back-up -->
    <script>
      function loadCdnChart() {
        let s = document.createElement('script');
        s.src = "https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js";
        document.head.appendChild(s);
      }
      window.addEventListener("load", function(){
        if (typeof Chart === "undefined") {
          loadCdnChart();
        }
      });
    </script>
    <script src="js/chart.umd.min.js" onerror="loadCdnChart()"></script>
  </head>
  <body>
    <div id="container">
      <div class="card" id="nav-card">
        <nav>
          <ul class="nav">
            <li class="nav-element">
              <a href="index.html">DER2</a>
            </li>
            <li class="nav-element">
              <a href="ticket-converter.html">HU Converter</a>
            </li>
            <li class="nav-element">
              <a href="pi-doc.html">PI Documents</a>
            </li>
            <li class="nav-element">
              <a href="cycle-counting.html">Cycle Count</a>
            </li>
          </ul>
        </nav>
        <div class="card" id="content-card">
          <div class="msg error fade-in" id="errors"></div>
          <div class="msg success" id="lastUpdated"></div>
           <h3>Cycle Count Report:</h3>
           <div class="msg success" id="percentCompleted"></div>
          <div class="chart-wrapper chart-glass">
            <div class="chart-container">
              <canvas id="aisleChartCanvas"></canvas>
            </div>
          </div>

          <div class="glass" id="action-box">
            <button class="button button-function" id="copy-odd-side">
              Copy Odd Side
            </button>
            <button class="button" id="copy-all">Copy All</button>
            <button class="button button-function" id="copy-even-side">
              Copy Even Side
            </button>
          </div>
          <div class="glass" id="section-content"></div>
          <div class="card glass" id="">
            <div class="output">
              <table id="cycleTable"></table>
            </div>
          </div>
        </div>
        <footer class="site-footer">
          <p>© 2026 Victor Garcia. All rights reserved.</p>
        </footer>
      </div>
    </div>
    <!-- Modals -->
    <div id="updateTrigger" class="modal">
      <div class="modal-content frosted-glass">
        <div class="login">
          <h2>Admin:</h2>
          <label for="adminEmail">Email</label>
          <input type="email" id="adminEmail" maxlength="24" />
          <label for="adminPass">Password</label>
          <input type="password" id="adminPass" maxlength="69" />
        </div>
        <div class="modal-actions">
          <button type="submit" id="updateSubmit" class="button button-confirm">
            Submit
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="live/cycle-live.js"></script>
  </body>
</html>
