<!doctype html>

            <li>
              <a href="cycle-counting.html">Cycle Count Report</a>

          </ul>

        <div class="card" id="content-card">
          <div class="msg error fade-in" id="errors"></div>
          <div class="msg success" id="lastUpdated"></div>
          <div class="side-by-side">
            <div class="form-row">
              <h3><button id="updateLoc"></button>Locations</h3>
              <input type="file" class="" id="excelInput" accept=".xlsx" disabled/>
            </div>
            <div class="form-row">
              <h3>Update Report</h3>
              <input type="file" class="" id="completeInput" accept=".xlsx" />
            </div>
          </div>
          <!-- <div class="glass" id="action-box"> -->

          <div class="glass" id="section-content"></div>
          <div class="card glass" id="">
            <div class="output">
              <table id="cycleTable"></table>
            </div>
          </div>
        </div>
        <footer class="site-footer">
          <p>© 2026 Victor Garcia. All rights reserved.</p>
        </footer>
      </div>

    <!-- Modals -->
    <div id="locTrigger" class="modal">
      <div class="modal-content frosted-glass">
        <h2>Password</h2>
        <div class="modal-actions">
          <input type="password" id="locPass" maxlength="24" />
          <button type="submit" id="locSubmit" class="button button-confirm">Submit</button>
        </div>
      </div>
    </div>
    <div id="updateTrigger" class="modal">
      <div class="modal-content frosted-glass">
        <h2>Password</h2>
        <div class="modal-actions">
          <input type="password" id="updatePass" maxlength="24" />
          <button type="submit" id="updateSubmit" class="button button-confirm">Submit</button>
        </div>
      </div>
    </div>
